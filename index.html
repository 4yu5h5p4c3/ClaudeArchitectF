<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Salesforce Certified Platform Developer II - Practice Assessment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="hud-header">
    <div class="hud-container">
      <div class="hud-stats">
        <select id="set-selector" class="set-selector">
          <option value="set1">Set 1 (Q1 - Q50)</option>
          <option value="set2">Set 2 (Q1 - Q60)</option>
          <option value="set3">Set 3 (Q1 - Q65)</option>
        </select>
        <div class="hud-pill">Score: <span id="hud-score" class="num">0</span> / <span id="hud-attempted">0</span> (<span id="hud-pct">0%</span>)</div>
        <div class="hud-pill">Progress: <span id="hud-answered" class="num">0</span> / <span id="hud-total">0</span></div>
      </div>
      <div class="hud-actions">
        <button class="btn-hud" id="btn-filter-missed">Missed Only</button>
        <button class="btn-hud" id="btn-reset">Reset</button>
      </div>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="hud-progress-bar"></div>
    </div>
  </header>

  <main class="quiz-container" id="quiz-mount"></main>

  <div class="modal-overlay" id="scorecard-modal">
    <div class="modal-box">
      <h2 style="font-size: 1.4rem;">Assessment Completed!</h2>
      <div class="score-circle">
        <span id="modal-score-pct">0%</span>
        <small id="modal-score-ratio">0/0</small>
      </div>
      <p id="modal-feedback" style="color: var(--text-muted); font-size: 0.95rem;"></p>
      <div class="modal-actions">
        <button class="btn-secondary" id="modal-btn-review">Review Missed</button>
        <button class="btn-primary" id="modal-btn-restart">Restart All</button>
      </div>
    </div>
  </div>

  <!-- Load question data files first -->
  <script src="questions-set1.js"></script>
  <script src="questions-set2.js"></script>
  <script src="questions-set3.js"></script>

  <!-- Then load your main logic -->
  <script src="script.js"></script>
</body>
</html>
